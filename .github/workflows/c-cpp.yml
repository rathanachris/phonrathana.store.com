name: CPP.CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: program 
      run: ./configure
    - name: make
      run: make
    - name: make check
      run: make check
    - name: make configure
      run: make distcheck
